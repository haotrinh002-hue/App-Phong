<dialog id="dlg">
  <form id="frm" novalidate>
    <div class="dlg-h"><h2 id="dlgTitle">Thêm chương trình</h2><button type="button" class="btn sm" id="dlgX">Đóng</button></div>
    <div class="dlg-b">
      <label class="full">Tên chương trình<input id="f-ten" required placeholder="VD: VIETNAM FOOD EXPO 2026" style="text-transform:uppercase"></label>
      <label>Loại hình<select id="f-loai"></select></label>
      <label>Trạng thái<select id="f-tt"></select><small style="font-weight:400">“Đang diễn ra” tự bật trong những ngày chương trình diễn ra</small></label>
      <label>Ngành hàng<select id="f-nganh"></select></label>
      <label>Thị trường / Quốc gia<input id="f-tt2" placeholder="VD: Nhật Bản"></label>
      <label>Địa điểm<input id="f-dd" placeholder="VD: Tokyo"></label>
      <label>Ngày bắt đầu<input id="f-bd" type="date" required></label>
      <label>Ngày kết thúc<input id="f-kt" type="date" required></label>
      <label class="full" style="flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink)"><input type="checkbox" id="f-crn" style="width:18px;height:18px;flex:none">Chưa rõ ngày, mới biết tháng (chọn một ngày bất kỳ trong tháng ở ô Ngày bắt đầu)</label>
      <div class="flabel full">Chuyên viên phụ trách (chọn nhiều người)<div class="chips" id="f-cv-chips"></div><select id="f-cv-add" aria-label="Thêm chuyên viên phụ trách"></select></div>
      <label>Lãnh đạo phụ trách<select id="f-ld"></select></label>
      <label>Kinh phí dự kiến (đồng)<input id="f-kp" inputmode="numeric"></label>
      <label>Nguồn thu về ITPC (đồng)<input id="f-thu" inputmode="numeric"></label>
      <label>Số doanh nghiệp đã đăng ký<input id="f-sodn" inputmode="numeric" placeholder="0"></label>
      <label>Số doanh nghiệp tối đa (chỉ tiêu)<input id="f-max" inputmode="numeric"></label>
      <label>Nguồn kinh phí<select id="f-nguon"></select></label>
      <label class="full">Ghi chú<textarea id="f-gc" rows="3"></textarea></label>
      <div class="err" id="f-err" hidden></div>
    </div>
    <div class="dlg-f"><button type="button" class="btn" id="dlgCancel">Hủy</button><button class="btn pri" type="submit">Lưu chương trình</button></div>
  </form>
</dialog>
<dialog id="dlgMC">
  <form id="frmMC" novalidate>
    <div class="dlg-h"><div style="min-width:0"><h2>Minh chứng hoàn thành</h2><div class="t-meta" id="mcTen"></div></div><button type="button" class="btn sm" id="mcX">Đóng</button></div>
    <div class="dlg-b" style="display:block">
      <div id="mcRows"></div>
      <button type="button" class="btn sm" id="mcAdd" style="margin-top:10px">+ Thêm minh chứng</button>
      <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:14px" class="mc-extra">
        <label>Ngày hoàn thành<input id="mcNgay" type="date"></label>
        <label>Ghi chú (tùy chọn)<input id="mcGc" placeholder="VD: đã gửi bản giấy cho Phòng Kế toán"></label>
      </div>
      <div class="err" id="mcErr" hidden style="margin-top:10px"></div>
    </div>
    <div class="dlg-f"><button type="button" class="btn" id="mcCancel">Hủy</button><button class="btn ok" type="submit">Xác nhận hoàn thành</button></div>
  </form>
</dialog>
<dialog id="dlgDN">
  <form id="frmDN" novalidate>
    <div class="dlg-h"><h2 id="dnTitle">Thêm doanh nghiệp</h2><button type="button" class="btn sm" id="dnX">Đóng</button></div>
    <div class="dlg-b">
      <label class="full">1. Tên doanh nghiệp / Công ty<input id="d-ten" placeholder="VD: CÔNG TY CP THỰC PHẨM SAO VIỆT" style="text-transform:uppercase"></label>
      <label>2. Ngành hàng<select id="d-nganh"></select></label>
      <label id="d-nganh-khac-wrap" hidden>Ngành hàng khác<input id="d-nganh-khac" placeholder="Ghi rõ ngành hàng"></label>
      <label class="full">3. Sản phẩm / dịch vụ chính<input id="d-sp" placeholder="VD: Cà phê rang xay, hạt điều"></label>
      <label>4. Quốc gia<input id="d-qg" list="qgList" placeholder="VD: Việt Nam"></label>
      <label>5. Mã số thuế<input id="d-mst" inputmode="numeric" placeholder="0123456789 hoặc 0123456789-001"></label>
      <label class="full">6. Địa chỉ<input id="d-dc" placeholder="Số nhà, tên đường, phường/xã, tỉnh/thành"></label>
      <label class="full">7. Website<input id="d-web" inputmode="url" placeholder="VD: congty.com.vn"></label>
      <label>8. Người liên hệ<input id="d-nlh"></label>
      <label>9. Chức vụ<input id="d-cv" placeholder="VD: Giám đốc"></label>
      <label>10. Số điện thoại<input id="d-sdt" inputmode="tel" placeholder="VD: 0903 123 456"></label>
      <label>11. Email<input id="d-email" type="email" placeholder="ten@congty.vn"></label>
      <div class="full flabel">Người liên hệ khác<div id="d-lhk"></div><button type="button" class="btn sm" id="d-lhk-add" style="align-self:flex-start">+ Thêm người liên hệ</button></div>
      <label class="full">12. Ghi chú<textarea id="d-gc" rows="3" placeholder="Ghi chú nội bộ, chỉ hiện khi mở chi tiết doanh nghiệp"></textarea></label>
      <div class="err" id="d-err" hidden></div>
      <div class="full" id="dnDelBox"></div>
    </div>
    <div class="dlg-f"><button type="button" class="btn danger" id="dnDel" style="margin-right:auto" hidden>Xóa</button><button type="button" class="btn" id="dnCancel">Hủy</button><button class="btn pri" type="submit">Lưu doanh nghiệp</button></div>
  </form>
</dialog>
<datalist id="qgList"></datalist>
<div class="toast" id="toast" hidden></div>

<script src="local-api.js"></script>
<script src="app.js"></script>
